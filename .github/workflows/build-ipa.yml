name: Build iOS IPA for Sideloadly

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build and Archive iOS App (Unsigned for Sideloadly)
        run: |
          xcodebuild clean archive \
            -project CyberNeonRogue.xcodeproj \
            -scheme CyberNeonRogue \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/CyberNeonRogue.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package App into .ipa (Payload Archive)
        run: |
          mkdir -p build/Payload
          cp -R build/CyberNeonRogue.xcarchive/Products/Applications/CyberNeonRogue.app build/Payload/
          cd build
          zip -r9 CyberNeonRogue.ipa Payload
          cd ..
          ls -lh build/CyberNeonRogue.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberNeonRogue-IPA
          path: build/CyberNeonRogue.ipa
          retention-days: 30

      - name: Create GitHub Release (If tagged or dispatched)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build/CyberNeonRogue.ipa
          name: "Cyber Neon Rogue iOS Release ${{ github.ref_name }}"
          body: |
            ## 🚀 CyberNeon: Quantum Rogue - iOS IPA Sideloadly Paketi
            
            Bu `.ipa` faylı **Sideloadly** və ya digər sideload proqramları (AltStore, TrollStore, Scarlet) vasitəsilə birbaşa iPhone-a yüklənmək üçün hazırdır.
            
            ### Quraşdırma:
            1. `CyberNeonRogue.ipa` faylını yükləyin.
            2. **Sideloadly** proqramını kompüterinizdə açın.
            3. iPhone-u USB kabel ilə kompüterə qoşun.
            4. `.ipa` faylını Sideloadly-yə sürükləyin və Apple ID-nizi daxil edib **Start** düyməsinə basın.
            5. iPhone-da `Tənzimləmələr -> Ümumi -> VPN və Cihaz İdarəetməsi` bölməsinə daxil olub sertifikata **Etibar et (Trust)** vurun və oyunu açın!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
